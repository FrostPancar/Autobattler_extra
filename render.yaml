services:
  - type: web
    name: autobattler-extra
    runtime: static
    buildCommand: bash render-build.sh
    staticPublishPath: ./render-static
    envVars:
      - key: SKIP_INSTALL_DEPS
        value: "true"

  - type: web
    name: coop-ws
    runtime: node
    buildCommand: npm install --prefix coop-server
    startCommand: node coop-server/server.js
